[General]
# envmod world: automated vehicles perceive vehicles without MCM with their radar sensors
network = artery.envmod.World
sim-time-limit = 300s
cmdenv-express-mode = true
cmdenv-autoflush = true
**.vector-recording = false

*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "mcm-twolane.sumocfg"
# traffic density relative to the rates in mcm-twolane.rou.xml
*.traci.launcher.extraOptions = "--scale 1.0"
*.traci.mapper.vehicleType = "artery.envmod.Car"

**.identityRegistryModule = "idRegistry"
*.environmentModel.traciModule = "traci"
*.environmentModel.nodeMobilityModule = ".mobility"
*.node[*].environmentModel.sensors = xmldoc("sensors.xml")
*.node[*].environmentModel.FrontLongRangeRadar.fovRange = 200m
*.node[*].environmentModel.FrontLongRangeRadar.fovAngle = 18
*.node[*].environmentModel.FrontShortRangeRadar.fovRange = 80m
*.node[*].environmentModel.FrontShortRangeRadar.fovAngle = 120
*.node[*].environmentModel.RearLongRangeRadar.fovRange = 200m
*.node[*].environmentModel.RearLongRangeRadar.fovAngle = 18
*.node[*].environmentModel.RearShortRangeRadar.fovRange = 80m
*.node[*].environmentModel.RearShortRangeRadar.fovAngle = 120

*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2018-03-19 10:00:00"
# equipment by vehicle category (coop_, manual_, truck_ in the SUMO id)
*.node[*].middleware.services = xmldoc("services.xml")

# CSV records of the maneuver coordination, see artery/mcm/McLog.h
*.node[*].middleware.MCS.logPrefix = "${resultdir}/${configname}-${runnumber}"

# lane changes: S-shaped (quintic) lateral profile, duration drawn per lane change
*.node[*].middleware.MCS.lateralShape = "quintic"
*.node[*].middleware.MCS.laneChangeDuration = uniform(3s, 6s)


[Config sumo-gui]
description = "mixed traffic, with SUMO GUI"
*.traci.launcher.sumo = "env LIBGL_ALWAYS_SOFTWARE=1 sumo-gui"
# announced trajectories as arrows: blue keep lane, green lane change, cyan yield, orange request
*.node[*].middleware.MCS.visualizeTrajectory = true

[Config ground-truth]
description = "mixed traffic, SUMO writes the driven trajectories (FCD) as ground truth"
*.traci.launcher.extraOptions = "--scale 1.0 --fcd-output ${resultdir}/${configname}-${runnumber}-fcd.xml --fcd-output.geo --precision.geo 9 --collision-output ${resultdir}/${configname}-${runnumber}-collisions.xml"

[Config density]
description = "mixed traffic at low, medium and high density"
*.traci.launcher.extraOptions = "--scale ${density=0.5, 1.0, 1.5}"

[Config negotiation]
description = "base concept (implicit answers) against explicit ACK/NACK of TR 103 578"
*.node[*].middleware.MCS.explicitResponses = ${explicit=false, true}
*.traci.launcher.extraOptions = "--scale ${density=1.0, 1.5}"

[Config legitimate-deviations]
description = "mixed traffic with aborted lane changes and lost messages"
*.node[*].middleware.MCS.abortProbability = ${pAbort=0.0, 0.05, 0.1}
*.node[*].middleware.MCS.abortAnnounced = ${announced=true, false}
*.node[*].middleware.MCS.dropProbability = ${pDrop=0.0, 0.1, 0.3}
