[General]
network = artery.inet.World
sim-time-limit = 300s
cmdenv-express-mode = true
cmdenv-autoflush = true
**.vector-recording = false

*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "mcm-highway.sumocfg"
# traffic density relative to the rates in mcm-highway.rou.xml
*.traci.launcher.extraOptions = "--scale 1.0"

*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2018-03-19 10:00:00"
*.node[*].middleware.services = xmldoc("services.xml")

# CSV records of the maneuver coordination, see artery/mcm/McLog.h
*.node[*].middleware.MCS.logPrefix = "${resultdir}/${configname}-${runnumber}"

# has to match lanechange.duration in mcm-highway.sumocfg
*.node[*].middleware.MCS.laneChangeDuration = 3s


[Config sumo-gui]
description = "honest traffic, with SUMO GUI"
*.traci.launcher.sumo = "env LIBGL_ALWAYS_SOFTWARE=1 sumo-gui"

[Config ground-truth]
description = "honest traffic, SUMO writes the driven trajectories (FCD) as ground truth"
*.traci.launcher.extraOptions = "--scale 1.0 --fcd-output ${resultdir}/${configname}-${runnumber}-fcd.xml --fcd-output.geo --precision.geo 9 --collision-output ${resultdir}/${configname}-${runnumber}-collisions.xml"

[Config density]
description = "honest traffic at low, medium and high density"
*.traci.launcher.extraOptions = "--scale ${density=0.5, 1.0, 1.5}"

[Config legitimate-deviations]
description = "honest traffic with aborted lane changes and lost accepts/cancellations"
*.node[*].middleware.MCS.abortProbability = ${pAbort=0.0, 0.05, 0.1}
*.node[*].middleware.MCS.abortWithCancel = ${withCancel=true, false}
*.node[*].middleware.MCS.dropProbability = ${pDrop=0.0, 0.1, 0.3}
